<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Search</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="d-flex flex-column min-vh-100 bdy">
        <div
            class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
            <div class="card border-0 rounded-4 p-4 p-md-5 shadow-lg"
                style="max-width: 480px; width: 100%;">
                <h3 class="fw-bold text-center mb-4">Search customer</h3>
                <form action>
                    <label for="customerId2"
                        class="form-label fw-semibold">Customer ID</label>
                    <input type="text" class="form-control py-2"
                        id="customerId2" placeholder="Enter ID (e.g. C001)">
                    <div class="d-grid mt-3">
                        <button type="button"
                            class="btn btn-primary fw-semibold py-2"
                            onclick="btnSearchcustomer()">
                            Search Id
                        </button>
                    </div>
                </form>
                <div class="mt-3 text-danger">
                    <p id="nametxt"></p>
                    <p id="agetxt"></p>
                    <p id="addresstxt"></p>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
